<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f7f4e9"><title>Dino Island · 恐龙漫游</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f4e9;color:#264a42;font-family:ui-rounded,'Arial Rounded MT Bold',system-ui,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none}main{max-width:1200px;margin:auto;padding:30px 34px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.brand{font-weight:900;letter-spacing:-1px;font-size:24px}.brand span{font-weight:500;font-size:12px;letter-spacing:2px;display:block;margin-top:4px;color:#7b8c78}.pill{border:1px solid #ccd4bd;border-radius:30px;padding:10px 16px;font-size:12px;font-weight:700}h1{font-size:clamp(30px,5vw,54px);letter-spacing:-2px;margin:0 0 8px}p{color:#7a8879;font-size:14px;margin:0}section.intro{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}.stats{display:flex;gap:28px}.stats label{font-size:10px;letter-spacing:2px;color:#84917c;display:block}.stats strong{display:block;font-size:27px;font-variant-numeric:tabular-nums;margin-top:5px}.game{position:relative;border-radius:28px;overflow:hidden;background:#cce8e2;box-shadow:0 14px 50px #284b4110}canvas{display:block;width:100%;height:clamp(320px,46vw,500px);touch-action:none}.badge{position:absolute;left:24px;top:22px;font-size:11px;letter-spacing:2px;background:#ffffff90;padding:10px 14px;border-radius:20px}.toolbar{position:absolute;right:18px;top:16px;display:flex;gap:8px}button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.icon{border:0;background:#ffffffb0;border-radius:50%;width:44px;height:44px;color:#345a49;font-size:18px}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:#d9ede219;pointer-events:none}.panel{background:#fbfaf0ed;backdrop-filter:blur(8px);padding:26px 36px;border-radius:24px;box-shadow:0 12px 40px #325b4e16;pointer-events:auto}.panel h2{margin:0 0 10px;font-size:26px}.panel p{margin-bottom:18px;line-height:1.7}.primary{border:0;background:#345f46;color:#fff9dc;border-radius:15px;padding:15px 35px;font-weight:800;box-shadow:0 5px 0 #254633}.below{display:flex;justify-content:space-between;align-items:center;padding-top:20px;gap:20px}.hint{font-size:12px;color:#8a917c;line-height:1.8}.controls{display:flex;gap:10px}.control{border:1px solid #d3dac7;background:#eeefdf;color:#456249;border-radius:16px;min-width:105px;padding:16px 24px;font-weight:800;touch-action:none}.control.jump{background:#e4b862;border-color:#e4b862;color:#574222;min-width:160px}.footer{margin-top:32px;display:flex;justify-content:space-between;font-size:10px;letter-spacing:1px;color:#a0a68f}.hidden{display:none!important}@media(max-width:650px){main{padding:20px 16px}header{margin-bottom:25px}.pill{font-size:10px;padding:8px 12px}section.intro{align-items:start}.stats{gap:14px}.stats strong{font-size:22px}h1{font-size:32px}.intro p{max-width:190px;font-size:12px}.below{align-items:stretch;flex-direction:column}.controls{justify-content:stretch}.control{flex:1}.badge{left:16px;top:20px}.panel{padding:24px}.footer{margin-top:20px}}@media(max-height:580px) and (orientation:landscape){main{padding:12px 24px}header,.intro,.footer{display:none!important}canvas{height:calc(100dvh - 110px)}.below{padding-top:12px;flex-direction:row}.control{padding:12px 24px}}
</style><main><header><div class="brand">dino island<span>A LITTLE ADVENTURE</span></div><div class="pill">✦ 随时出发的小冒险</div></header><section class="intro"><div><h1>跑进好天气。</h1><p>一只小恐龙，一段没有终点的岛屿旅行。</p></div><div class="stats"><div><label>DISTANCE</label><strong id="score">00000</strong></div><div><label>BEST</label><strong id="best">00000</strong></div></div></section><div class="game"><canvas id="canvas" aria-label="恐龙跑酷游戏，点击跳跃，按住下蹲按钮躲避飞鸟"></canvas><span class="badge" id="biome">01 / 晨光草原</span><div class="toolbar"><button class="icon" id="sound" aria-label="开启音效">♪</button><button class="icon" id="pause" aria-label="暂停游戏">Ⅱ</button></div><div class="overlay" id="overlay"><div class="panel"><h2 id="title">准备好出发了吗？</h2><p id="description">轻触屏幕跳跃，躲开仙人掌。<br>按住下蹲，还能避开飞鸟。</p><button class="primary" id="start">开始冒险 ↗</button></div></div></div><div class="below"><div class="hint">轻触画面或按空格跳跃 · 按住 ↓ 下蹲<br>长按跳得更高 · 每 300 米，发现新风景</div><div class="controls"><button class="control" id="duck">↓ 下蹲</button><button class="control jump" id="jump">↑ 跳跃</button></div></div><div class="footer"><span>TAKE A BREATH. TAKE A LEAP.</span><span>为触屏而生 · 横屏更开阔</span></div></main><script>
'use strict';
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);
let W=1000,H=450,last=0,mode='ready',distance=0,speed=300,spawn=1.6,objects=[],time=0,duck=false,held=false,y=0,vy=0,sound=false,audio=null,best=0,scene=0;
try{best=Number(localStorage.getItem('dino-island-best'))||0}catch(e){} $('best').textContent=String(best).padStart(5,'0');
const palettes=[['#cbe9e5','#f8e6a1','#94bdab','#bed6b6','#6e9968','#d5dca8','晨光草原'],['#f5d7bb','#ffe8ad','#c29baa','#deb0a0','#a07663','#e7c393','落日沙丘'],['#293e5b','#fff0b6','#435778','#526e86','#547d7d','#96ae9d','星夜森林']];
function resize(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;const d=Math.min(devicePixelRatio||1,2);canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0)} addEventListener('resize',resize);resize();
function beep(f,d=.09){if(!sound)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.type='sine';o.frequency.setValueAtTime(f,audio.currentTime);g.gain.setValueAtTime(.07,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function panel(title,desc,button){$('title').textContent=title;$('description').innerHTML=desc;$('start').textContent=button;$('overlay').classList.remove('hidden')}
function start(){if(mode==='paused'){mode='running';$('overlay').classList.add('hidden');return}distance=0;speed=300;spawn=1.6;objects=[];y=0;vy=0;duck=false;held=false;scene=0;mode='running';$('overlay').classList.add('hidden');beep(520)}
function jump(){if(mode!=='running')return;if(y===0){vy=-(duck?540:600);duck=false;beep(520)}held=true}
function pause(){if(mode==='running'){mode='paused';held=false;duck=false;panel('歇一小会儿。','风景会等你，准备好就继续。','继续冒险 ↗')}else if(mode==='paused')start()}
function over(){mode='over';held=false;duck=false;beep(130,.25);let n=Math.floor(distance);if(n>best){best=n;try{localStorage.setItem('dino-island-best',String(best))}catch(e){}}$('best').textContent=String(best).padStart(5,'0');panel('再来一段旅程？','这次跑了 <b>'+n+' 米</b>，下一次会更远。','再次出发 ↗')}
$('start').onclick=start;$('pause').onclick=pause;$('sound').onclick=()=>{sound=!sound;$('sound').style.background=sound?'#e4b862':'#ffffffb0';$('sound').setAttribute('aria-label',sound?'关闭音效':'开启音效');beep(660)};
function bindJump(el){el.onpointerdown=e=>{e.preventDefault();el.setPointerCapture(e.pointerId);jump()};el.onpointerup=el.onpointercancel=()=>held=false}bindJump(canvas);bindJump($('jump'));
$('duck').onpointerdown=e=>{e.preventDefault();$('duck').setPointerCapture(e.pointerId);if(mode==='running'){duck=true;held=false;if(y>0)vy=Math.max(vy,700)}};$('duck').onpointerup=$('duck').onpointercancel=()=>duck=false;
addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();if(e.repeat)return;if(e.code==='Space'||e.code==='ArrowUp'){if(mode==='ready'||mode==='over')start();else jump()}if(e.code==='ArrowDown')duck=true;if(e.code==='KeyP'||e.code==='Escape')pause()});addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowUp')held=false;if(e.code==='ArrowDown')duck=false});document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='running')pause()});addEventListener('blur',()=>{if(mode==='running')pause()});
function round(x,y,w,h,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function cloud(x,z,s){ctx.fillStyle='#ffffff70';ctx.beginPath();ctx.ellipse(x,z,34*s,10*s,0,0,7);ctx.ellipse(x-12*s,z-8*s,15*s,15*s,0,0,7);ctx.ellipse(x+10*s,z-11*s,19*s,18*s,0,0,7);ctx.fill()}
function hill(base,amp,color,offset){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W+10;x+=10)ctx.lineTo(x,base+Math.sin((x+offset)/170)*amp+Math.cos((x+offset)/90)*amp*.25);ctx.lineTo(W,H);ctx.fill()}
function dino(x,ground){let crouch=duck&&y===0;let z=ground-y;let bob=mode==='running'&&y===0?Math.sin(time*18)*1.7:0;ctx.save();ctx.translate(x,z+bob);if(crouch){round(-4,-28,48,24,8,'#386e50');round(30,-31,31,20,6,'#386e50');round(51,-26,4,4,1,'#fff8dd')}else{round(0,-43,30,36,8,'#386e50');round(17,-68,35,30,6,'#386e50');round(39,-62,5,5,1,'#fff8dd');round(42,-61,2,3,0,'#233b2f');round(35,-46,18,3,1,'#244d37');round(23,-29,18,6,2,'#386e50');ctx.fillStyle='#386e50';ctx.beginPath();ctx.moveTo(5,-24);ctx.lineTo(-21,-41);ctx.lineTo(-16,-16);ctx.lineTo(9,-10);ctx.fill();for(let i=0;i<3;i++)round(4+i*1.5,-48+i*8,5,5,1,'#e8bd69');round(16,-38,9,21,4,'#8fb573')}
let leg=mode==='running'&&y===0?Math.sin(time*20)*6:0;round(3,-11,8,11+leg,2,'#2e5a42');round(21,-11,8,11-leg,2,'#2e5a42');ctx.restore()}
function draw(){let p=palettes[scene],g=H*.79;ctx.fillStyle=p[0];ctx.fillRect(0,0,W,H);ctx.fillStyle=p[1];ctx.beginPath();ctx.arc(W*.77,H*.23,31,0,Math.PI*2);ctx.fill();if(scene===2){ctx.fillStyle='#f5ecc190';for(let i=0;i<25;i++){let x=(i*137+30)%W,z=(i*79)%Math.max(60,H*.45);ctx.fillRect(x,z,2,2)}}for(let i=0;i<4;i++)cloud(((i*310-time*7)%(W+240)+W+240)%(W+240)-100,65+(i%3)*27,.7+i*.12);hill(H*.54,34,p[2],time*7);hill(H*.67,25,p[3],time*14);for(let i=0;i<7;i++){let x=((i*220-time*28)%(W+220)+W+220)%(W+220)-70;ctx.fillStyle=p[4];ctx.beginPath();ctx.ellipse(x,g-15,44,28,0,0,7);ctx.fill()}ctx.fillStyle=p[5];ctx.fillRect(0,g,W,H-g);ctx.fillStyle='#4e6e4833';ctx.fillRect(0,g,W,3);for(let i=0;i<25;i++){let x=((i*71-time*(mode==='running'?speed:25))%(W+80)+W+80)%(W+80)-20;round(x,g+15+(i%4)*15,8+i%5,2,1,'#82966b44')}for(const o of objects){if(o.kind==='bird'){let z=g-o.bottom;ctx.fillStyle='#875d43';ctx.beginPath();ctx.ellipse(o.x+17,z-13,20,10,0,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(o.x+15,z-13);ctx.lineTo(o.x+8,z-35-Math.sin(time*16)*12);ctx.lineTo(o.x+30,z-15);ctx.fill();ctx.fillStyle='#e2ad5e';ctx.beginPath();ctx.moveTo(o.x-5,z-16);ctx.lineTo(o.x-14,z-9);ctx.lineTo(o.x,z-9);ctx.fill();round(o.x+1,z-18,3,3,0,'#fff')}else{round(o.x,g-o.h,o.w,o.h,6,'#527b51');round(o.x-9,g-o.h+15,12,9,4,'#527b51');round(o.x-9,g-o.h+4,7,20,4,'#527b51');round(o.x+o.w-3,g-o.h+24,13,8,4,'#527b51');round(o.x+o.w+3,g-o.h+10,7,20,4,'#527b51');round(o.x+6,g-o.h+7,3,o.h-13,1,'#86a668')}}dino(Math.min(115,W*.2),g)}
function update(dt){time+=dt;if(mode!=='running')return;distance+=dt*speed/35;speed=Math.min(540,300+distance*.13);let newScene=Math.floor(distance/300)%3;if(newScene!==scene){scene=newScene;beep(780,.15)}$('biome').textContent='0'+(scene+1)+' / '+palettes[scene][6];$('score').textContent=String(Math.floor(distance)).padStart(5,'0');if(y>0||vy<0){vy+=(held&&vy<0?1250:1900)*dt;y-=vy*dt;if(y<0){y=0;vy=0}}spawn-=dt;if(spawn<=0){let bird=distance>170&&Math.random()<.28;objects.push({x:W+40,w:bird?40:22+Math.random()*10,h:bird?26:36+Math.random()*24,bottom:bird?40:0,kind:bird?'bird':'cactus'});spawn=1.4+Math.random()*.65}let px=Math.min(115,W*.2);for(let o of objects){o.x-=speed*dt;let ph=duck&&y===0?26:59,pw=duck&&y===0?50:37;let a={x:px+3,y:H*.79-y-ph,w:pw,h:ph-4},b={x:o.x+3,y:H*.79-o.bottom-o.h,w:o.w-6,h:o.h-3};if(a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y){over();break}}objects=objects.filter(o=>o.x>-80)}
function frame(t){let dt=Math.min((t-last)/1000||0,.033);last=t;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>

<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf9f5"><title>Dino Island</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#faf9f5;overflow:hidden}body{display:grid;place-items:center;font-family:monospace;user-select:none;-webkit-user-select:none;overscroll-behavior:none}main{width:min(100%,1000px);padding:0 24px;position:relative}canvas{width:100%;height:280px;display:block;image-rendering:pixelated;touch-action:none}nav{height:60px;display:flex;align-items:center;justify-content:flex-end;gap:12px}button{border:0;background:transparent;color:#9b9e94;min-width:48px;min-height:48px;font:24px monospace;touch-action:none;-webkit-tap-highlight-color:transparent;cursor:pointer}button:active{color:#53735a;background:#efeee7}#hint{position:absolute;left:0;right:0;top:43%;text-align:center;color:#8a8d81;font:12px monospace;pointer-events:none;letter-spacing:3px}#pause{font-size:18px}button:focus-visible{outline:2px solid #69876b}@media(max-width:600px){main{padding:0 16px}canvas{height:240px}nav{justify-content:space-between}}@media(max-height:400px){canvas{height:210px}nav{height:48px}}</style><main><canvas id="game" aria-label="像素恐龙游戏，轻触跳跃"></canvas><div id="hint">轻触开始</div><nav><button id="pause" aria-label="暂停或继续">Ⅱ</button><button id="duck" aria-label="按住下蹲">↓</button><button id="jump" aria-label="跳跃">↑</button></nav></main><script>
'use strict';
const c=document.getElementById('game'),x=c.getContext('2d'),hint=document.getElementById('hint');let W=900,H=250,G=205,state='ready',y=0,vy=0,held=false,duck=false,dist=0,speed=280,elapsed=0,timer=1.7,obs=[],last=0,best=0;try{best=+localStorage.getItem('dino-island-best')||0}catch{}const palettes=[['#faf9f5','#59675b','#8b9d75','#c3bda8','#d8d9ce','#e4c983'],['#faf6f1','#706557','#b39a78','#cbbda9','#e3d7ca','#dfb584'],['#f4f6f8','#596574','#8b9d9e','#b7c0c6','#d6dce0','#b5c5d5']];
function resize(){let r=c.getBoundingClientRect();W=Math.round(r.width);H=Math.round(r.height);G=H-42;let d=Math.min(devicePixelRatio||1,2);c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);x.imageSmoothingEnabled=false}addEventListener('resize',resize);resize();
function start(){state='run';dist=0;y=vy=0;held=duck=false;obs=[];timer=1.7;speed=280;hint.textContent=''}function pause(){if(state==='run'){state='paused';held=duck=false;hint.textContent='Ⅱ'}else if(state==='paused'){state='run';hint.textContent=''}}function jump(){if(state==='ready'||state==='over'){start();return}if(state==='paused'){pause();return}if(y===0){vy=-570;duck=false}held=true}function end(){state='over';held=duck=false;hint.textContent='GAME OVER  ↻';best=Math.max(best,Math.floor(dist));try{localStorage.setItem('dino-island-best',best)}catch{}}
function bind(el){el.onpointerdown=e=>{e.preventDefault();el.setPointerCapture(e.pointerId);jump()};el.onpointerup=el.onpointercancel=()=>held=false}bind(c);bind(document.getElementById('jump'));const db=document.getElementById('duck');db.onpointerdown=e=>{e.preventDefault();db.setPointerCapture(e.pointerId);if(state==='run'){duck=true;held=false;if(y>0)vy=Math.max(700,vy)}};db.onpointerup=db.onpointercancel=()=>duck=false;document.getElementById('pause').onclick=pause;
addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();if(e.repeat)return;if(e.code==='Space'||e.code==='ArrowUp')jump();if(e.code==='ArrowDown')duck=true;if(e.code==='KeyP'||e.code==='Escape')pause()});addEventListener('keyup',e=>{if(['Space','ArrowUp'].includes(e.code))held=false;if(e.code==='ArrowDown')duck=false});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='run')pause()});addEventListener('blur',()=>{if(state==='run')pause()});
const dino=["            ##########","           ############","           ###  #######","           ############","           ############","           ############","           ######      ","           #########   ","#         ####         ","#        #####         ","##      ########       ","###    ####### #       ","####  ########         ","##############         ","##############         "," ############          ","  ###########          ","   #########           ","    #######            ","     #####             "];
const crouch=["             ########## ","            ############","            ###  #######","############### ########","########################"," #######################","  ##############        ","    ##########          ","     #######            "];
const bird=["        #       ","       ##       ","      ###       ","     ####       ","#   #####       ","#############   ","  ##############","   ##########   ","    ####        "];
function pixels(rows,px,py,s,color){x.fillStyle=color;rows.forEach((row,j)=>{for(let i=0;i<row.length;i++)if(row[i]==='#')x.fillRect(Math.round(px+i*s),Math.round(py+j*s),s,s)})}
const nums=['111101101101111','010110010010111','111001111100111','111001111001111','101101111001001','111100111001111','111100111101111','111001001001001','111101111101111','111101111001111'];function digits(str,px,py,color){x.fillStyle=color;for(let k=0;k<str.length;k++){let n=nums[+str[k]];for(let i=0;i<15;i++)if(n[i]==='1')x.fillRect(px+k*10+(i%3)*2,py+Math.floor(i/3)*2,2,2)}}
function draw(){let p=palettes[Math.floor(dist/300)%3];document.body.style.background=p[0];x.fillStyle=p[0];x.fillRect(0,0,W,H);const px=Math.min(70,W*.16);x.fillStyle='#a3a69d';x.font='11px monospace';x.fillText('HI',W-142,24);digits(String(best).padStart(5,'0').slice(-5),W-120,15,'#a3a69d');digits(String(Math.floor(dist)).padStart(5,'0').slice(-5),W-50,15,p[1]);
// A few restrained, pixel-edged clouds and a small sun; mostly whitespace.
x.fillStyle=p[5];x.fillRect(W*.72,68,12,12);x.fillRect(W*.72+2,66,8,16);x.fillRect(W*.72-2,70,16,8);
for(let i=0;i<3;i++){let q=Math.round(((i*310+180-elapsed*7)%(W+180)+W+180)%(W+180)-60),z=82+(i%2)*30;x.strokeStyle=p[4];x.lineWidth=1;x.beginPath();x.moveTo(q,z+10);x.lineTo(q+7,z+10);x.lineTo(q+7,z+5);x.lineTo(q+15,z+5);x.lineTo(q+15,z);x.lineTo(q+26,z);x.lineTo(q+26,z+5);x.lineTo(q+34,z+5);x.lineTo(q+34,z+10);x.lineTo(q+45,z+10);x.lineTo(q+45,z+13);x.lineTo(q,z+13);x.stroke()}
x.fillStyle=p[3];x.fillRect(0,G+1,W,1);for(let i=0;i<30;i++){let q=Math.round(((i*63-elapsed*speed)%(W+80)+W+80)%(W+80));x.fillRect(q,G+7+(i%4)*5,2+(i%5)*2,1)}
for(const o of obs){let q=Math.round(o.x),z=G-o.h;if(o.kind==='bird'){let rows=bird;pixels(rows,q,G-o.bottom-o.h,2,p[1]);if(Math.sin(elapsed*14)<0){x.fillStyle=p[0];x.fillRect(q+10,G-o.bottom-o.h,10,9);x.fillStyle=p[1];x.fillRect(q+14,G-o.bottom-4,6,12)}}else{x.fillStyle=p[2];x.fillRect(q+4,z,8,o.h);x.fillRect(q+6,z-2,4,2);x.fillRect(q-4,z+12,8,6);x.fillRect(q-4,z+5,4,11);x.fillRect(q+12,z+22,9,5);x.fillRect(q+17,z+13,4,12)}}
let z=Math.round(G-y),isDuck=duck&&y===0;pixels(isDuck?crouch:dino,px,z-(isDuck?26:48),2,p[1]);let step=state==='run'&&y===0?Math.floor(elapsed*12)%2:0;x.fillStyle=p[1];x.fillRect(px+10,z-8,4,step?4:8);x.fillRect(px+10,z-(step?4:1),8,2);x.fillRect(px+23,z-8,4,step?8:4);x.fillRect(px+23,z-(step?1:4),8,2)}
function update(dt){if(state!=='run')return;elapsed+=dt;dist+=speed*dt/35;speed=Math.min(510,280+dist*.12);if(y>0||vy<0){vy+=(held&&vy<0?1250:1900)*dt;y-=vy*dt;if(y<0){y=0;vy=0}}timer-=dt;if(timer<=0){let b=dist>170&&Math.random()<.25;obs.push({x:W+30,kind:b?'bird':'cactus',w:b?30:21,h:b?18:30+Math.floor(Math.random()*13),bottom:b?30:0});timer=1.35+Math.random()*.7}let px=Math.min(70,W*.16);for(let o of obs){o.x-=speed*dt;let ph=duck&&y===0?22:44,pw=duck&&y===0?43:32;let a={x:px+5,y:G-y-ph,w:pw,h:ph-3},b={x:o.x+2,y:G-o.bottom-o.h,w:o.w-4,h:o.h-2};if(a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y){end();break}}obs=obs.filter(o=>o.x>-60)}function frame(t){let dt=Math.min((t-last)/1000||0,.033);last=t;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>

<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf9f5"><title>Dino Island</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#faf9f5;overflow:hidden}body{display:grid;place-items:center;font-family:monospace;user-select:none;-webkit-user-select:none;overscroll-behavior:none}main{width:min(100%,1000px);padding:0 24px;position:relative}canvas{width:100%;height:280px;display:block;image-rendering:pixelated;touch-action:none}nav{height:60px;display:flex;align-items:center;justify-content:flex-end;gap:12px}button{border:0;background:transparent;color:#9b9e94;min-width:48px;min-height:48px;font:24px monospace;touch-action:none;-webkit-tap-highlight-color:transparent;cursor:pointer}button:active{color:#53735a;background:#efeee7}#hint{position:absolute;left:0;right:0;top:43%;text-align:center;color:#8a8d81;font:12px monospace;pointer-events:none;letter-spacing:3px}#pause{font-size:18px}button:focus-visible{outline:2px solid #69876b}@media(max-width:600px){main{padding:0 16px}canvas{height:240px}nav{justify-content:space-between}}@media(max-height:400px){canvas{height:210px}nav{height:48px}}</style><main><canvas id="game" aria-label="像素恐龙游戏，轻触跳跃"></canvas><div id="hint">轻触开始</div><nav><button id="sound" aria-label="关闭声音" aria-pressed="false" title="声音">♪</button><button id="pause" aria-label="暂停或继续">Ⅱ</button><button id="duck" aria-label="按住下蹲">↓</button><button id="jump" aria-label="跳跃">↑</button></nav></main><script>
'use strict';
const c=document.getElementById('game'),x=c.getContext('2d'),hint=document.getElementById('hint');let W=900,H=250,G=205,state='ready',y=0,vy=0,held=false,duck=false,dist=0,speed=280,elapsed=0,timer=1.7,obs=[],last=0,best=0;try{best=+localStorage.getItem('dino-island-best')||0}catch{}const palettes=[['#faf9f5','#59675b','#8b9d75','#c3bda8','#d8d9ce','#e4c983'],['#faf6f1','#706557','#b39a78','#cbbda9','#e3d7ca','#dfb584'],['#f4f6f8','#596574','#8b9d9e','#b7c0c6','#d6dce0','#b5c5d5']];

// Original, quiet chiptune accompaniment; synthesized locally, no downloads.
let ac=null,master=null,muted=false,nextNote=0,noteIndex=0,scoreCue=0;
const voices=new Set(),soundButton=document.getElementById('sound');
try{muted=localStorage.getItem('dino-island-muted')==='1'}catch{}
function soundUI(){soundButton.textContent=muted?'♪×':'♪';soundButton.setAttribute('aria-label',muted?'开启声音':'关闭声音');soundButton.setAttribute('aria-pressed',String(muted))}soundUI();
function unlockAudio(){try{if(!ac){const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;ac=new Audio();master=ac.createGain();master.gain.value=muted?0:.32;master.connect(ac.destination)}if(ac.state!=='running')ac.resume().catch(()=>{});}catch{}}
function silence(){for(const v of voices){try{v.stop()}catch{}}voices.clear();nextNote=0}
function tone(f,d=.1,volume=.1,type='square',when=0,to=0){if(!ac||muted||document.hidden)return;try{const t=when||ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(volume,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);voices.add(o);o.onended=()=>{voices.delete(o);o.disconnect();g.disconnect()};o.start(t);o.stop(t+d+.01)}catch{}}
function effect(name){if(name==='duck')tone(260,.085,.13,'square',0,130);if(name==='jump')tone(470,.11,.22,'square',0,880);if(name==='score'){tone(880,.1,.18);tone(1175,.16,.18,'square',ac?ac.currentTime+.1:0)}if(name==='hit')tone(170,.28,.3,'sawtooth',0,48)}
const melody=[76,0,79,0,81,79,76,0,74,0,72,0,74,76,79,0,76,0,79,0,84,83,81,0,79,0,76,0,74,72,74,0];
function music(){if(!ac||ac.state!=='running'||muted||state!=='run'||document.hidden)return;if(!nextNote||nextNote<ac.currentTime-.2)nextNote=ac.currentTime+.025;while(nextNote<ac.currentTime+.12){const n=melody[noteIndex%melody.length];if(n)tone(440*Math.pow(2,(n-69)/12),.15,.065,'square',nextNote);if(noteIndex%4===0){const bass=[48,53,48,55][Math.floor(noteIndex/8)%4];tone(440*Math.pow(2,(bass-69)/12),.3,.13,'triangle',nextNote)}noteIndex++;nextNote+=.2}}
soundButton.onclick=()=>{muted=!muted;unlockAudio();silence();if(master)master.gain.setValueAtTime(muted?0:.32,ac.currentTime);try{localStorage.setItem('dino-island-muted',muted?'1':'0')}catch{}soundUI();music()};

function resize(){let r=c.getBoundingClientRect();W=Math.round(r.width);H=Math.round(r.height);G=H-42;let d=Math.min(devicePixelRatio||1,2);c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);x.imageSmoothingEnabled=false}addEventListener('resize',resize);resize();
function start(){unlockAudio();silence();noteIndex=scoreCue=0;state='run';dist=0;y=vy=0;held=duck=false;obs=[];timer=1.7;speed=280;hint.textContent=''}function pause(){if(state==='run'){silence();state='paused';held=duck=false;hint.textContent='Ⅱ'}else if(state==='paused'){unlockAudio();nextNote=0;state='run';hint.textContent=''}}function jump(){unlockAudio();if(state==='ready'||state==='over'){start();return}if(state==='paused'){pause();return}if(y===0){vy=-570;duck=false;effect('jump')}held=true}function end(){silence();effect('hit');state='over';held=duck=false;hint.textContent='GAME OVER  ↻';best=Math.max(best,Math.floor(dist));try{localStorage.setItem('dino-island-best',best)}catch{}}
function crouchDown(){if(state!=='run'||duck)return;unlockAudio();duck=true;held=false;effect('duck');if(y>0)vy=Math.max(700,vy)}
function bind(el){el.onpointerdown=e=>{e.preventDefault();el.setPointerCapture(e.pointerId);jump()};el.onpointerup=el.onpointercancel=()=>held=false}bind(c);bind(document.getElementById('jump'));const db=document.getElementById('duck');db.onpointerdown=e=>{e.preventDefault();db.setPointerCapture(e.pointerId);crouchDown()};db.onpointerup=db.onpointercancel=()=>duck=false;document.getElementById('pause').onclick=pause;
addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();if(e.repeat)return;if(e.code==='Space'||e.code==='ArrowUp')jump();if(e.code==='ArrowDown')crouchDown();if(e.code==='KeyP'||e.code==='Escape')pause()});addEventListener('keyup',e=>{if(['Space','ArrowUp'].includes(e.code))held=false;if(e.code==='ArrowDown')duck=false});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='run')pause()});addEventListener('blur',()=>{if(state==='run')pause()});
const dino=["            ##########","           ############","           ###  #######","           ############","           ############","           ############","           ######      ","           #########   ","#         ####         ","#        #####         ","##      ########       ","###    ####### #       ","####  ########         ","##############         ","##############         "," ############          ","  ###########          ","   #########           ","    #######            ","     #####             "];
const crouch=["             ########## ","            ############","            ###  #######","############### ########","########################"," #######################","  ##############        ","    ##########          ","     #######            "];
const bird=["        #       ","       ##       ","      ###       ","     ####       ","#   #####       ","#############   ","  ##############","   ##########   ","    ####        "];
function pixels(rows,px,py,s,color){x.fillStyle=color;rows.forEach((row,j)=>{for(let i=0;i<row.length;i++)if(row[i]==='#')x.fillRect(Math.round(px+i*s),Math.round(py+j*s),s,s)})}
const nums=['111101101101111','010110010010111','111001111100111','111001111001111','101101111001001','111100111001111','111100111101111','111001001001001','111101111101111','111101111001111'];function digits(str,px,py,color){x.fillStyle=color;for(let k=0;k<str.length;k++){let n=nums[+str[k]];for(let i=0;i<15;i++)if(n[i]==='1')x.fillRect(px+k*10+(i%3)*2,py+Math.floor(i/3)*2,2,2)}}
function draw(){let p=palettes[Math.floor(dist/300)%3];document.body.style.background=p[0];x.fillStyle=p[0];x.fillRect(0,0,W,H);const px=Math.min(70,W*.16);x.fillStyle='#a3a69d';x.font='11px monospace';x.fillText('HI',W-142,24);digits(String(best).padStart(5,'0').slice(-5),W-120,15,'#a3a69d');digits(String(Math.floor(dist)).padStart(5,'0').slice(-5),W-50,15,p[1]);
// A few restrained, pixel-edged clouds and a small sun; mostly whitespace.
x.fillStyle=p[5];x.fillRect(W*.72,68,12,12);x.fillRect(W*.72+2,66,8,16);x.fillRect(W*.72-2,70,16,8);
for(let i=0;i<3;i++){let q=Math.round(((i*310+180-elapsed*7)%(W+180)+W+180)%(W+180)-60),z=82+(i%2)*30;x.strokeStyle=p[4];x.lineWidth=1;x.beginPath();x.moveTo(q,z+10);x.lineTo(q+7,z+10);x.lineTo(q+7,z+5);x.lineTo(q+15,z+5);x.lineTo(q+15,z);x.lineTo(q+26,z);x.lineTo(q+26,z+5);x.lineTo(q+34,z+5);x.lineTo(q+34,z+10);x.lineTo(q+45,z+10);x.lineTo(q+45,z+13);x.lineTo(q,z+13);x.stroke()}
x.fillStyle=p[3];x.fillRect(0,G+1,W,1);for(let i=0;i<30;i++){let q=Math.round(((i*63-elapsed*speed)%(W+80)+W+80)%(W+80));x.fillRect(q,G+7+(i%4)*5,2+(i%5)*2,1)}
for(const o of obs){let q=Math.round(o.x),z=G-o.h;if(o.kind==='bird'){let rows=bird;pixels(rows,q,G-o.bottom-o.h,2,p[1]);if(Math.sin(elapsed*14)<0){x.fillStyle=p[0];x.fillRect(q+10,G-o.bottom-o.h,10,9);x.fillStyle=p[1];x.fillRect(q+14,G-o.bottom-4,6,12)}}else{x.fillStyle=p[2];x.fillRect(q+4,z,8,o.h);x.fillRect(q+6,z-2,4,2);x.fillRect(q-4,z+12,8,6);x.fillRect(q-4,z+5,4,11);x.fillRect(q+12,z+22,9,5);x.fillRect(q+17,z+13,4,12)}}
let z=Math.round(G-y),isDuck=duck&&y===0;pixels(isDuck?crouch:dino,px,z-(isDuck?26:48),2,p[1]);let step=state==='run'&&y===0?Math.floor(elapsed*12)%2:0;x.fillStyle=p[1];x.fillRect(px+10,z-8,4,step?4:8);x.fillRect(px+10,z-(step?4:1),8,2);x.fillRect(px+23,z-8,4,step?8:4);x.fillRect(px+23,z-(step?1:4),8,2)}
function update(dt){if(state!=='run')return;elapsed+=dt;dist+=speed*dt/35;speed=Math.min(510,280+dist*.12);if(Math.floor(dist/100)>scoreCue){scoreCue=Math.floor(dist/100);effect('score')}if(y>0||vy<0){vy+=(held&&vy<0?1250:1900)*dt;y-=vy*dt;if(y<0){y=0;vy=0}}timer-=dt;if(timer<=0){let b=dist>170&&Math.random()<.25;obs.push({x:W+30,kind:b?'bird':'cactus',w:b?30:21,h:b?18:30+Math.floor(Math.random()*13),bottom:b?30:0});timer=1.35+Math.random()*.7}let px=Math.min(70,W*.16);for(let o of obs){o.x-=speed*dt;let ph=duck&&y===0?22:44,pw=duck&&y===0?43:32;let a={x:px+5,y:G-y-ph,w:pw,h:ph-3},b={x:o.x+2,y:G-o.bottom-o.h,w:o.w-4,h:o.h-2};if(a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y){end();break}}obs=obs.filter(o=>o.x>-60)}function frame(t){let dt=Math.min((t-last)/1000||0,.033);last=t;update(dt);music();draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>

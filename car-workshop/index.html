<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#163b40"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="description" content="伴着音乐亲手拼装十种汽车，再开上有护栏的公路赛道。"><title>小小车库 · 3D 汽车工坊</title><link rel="stylesheet" href="./style.css?v=3">
</head>
<body>
<main id="scene" aria-label="三维汽车拼装车库"><div id="loading"><div class="loading-mark">⚙</div><strong>打开车库...</strong></div></main>
<div class="hud">
 <header class="topbar">
  <button id="garage" class="vehicle-button" aria-label="打开车库，选择车型"><span class="garage-icon">▦</span><span><small>小小车库</small><strong id="vehicle-name">奔驰大 G</strong></span><span class="chevron">⌄</span></button>
  <div class="top-actions"><button id="sound" class="icon-button" aria-label="关闭音乐和音效" title="关闭音乐和音效" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4zM15 8c3 2 3 6 0 8m3-11c5 4 5 10 0 14"/></svg></button><button id="help" class="icon-button" aria-label="怎么玩">?</button></div>
 </header>
 <button id="target" hidden aria-label="把选中的零件装到这里"><span>＋</span></button>
 <div class="view-tools"><button id="zoom-in" class="icon-button" aria-label="放大">＋</button><button id="zoom-out" class="icon-button" aria-label="缩小">−</button><button id="home-view" class="icon-button" aria-label="回到完整视角"><svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8M6 9v11h12V9M9 20v-7h6v7"/></svg></button></div>
 <footer class="bottom-bar" id="assembly-controls"><button id="reset" class="tool-button" aria-label="重新拆开这辆车"><svg viewBox="0 0 24 24"><path d="M4 9a8 8 0 1 1 0 6M4 3v6h6"/></svg><span>拆开</span></button><div id="parts" class="parts-strip" aria-label="这辆车的零件"></div><button id="drive" class="drive-button" hidden><span>▶</span> 出发</button></footer>
 <section id="driving-hud" hidden aria-label="公路驾驶">
  <div class="drive-heading"><button id="return-garage" class="return-button">‹ 回车库</button><div class="road-label"><strong>阳光环岛公路</strong><span>弯道辅助 · 方向键或按住踏板</span></div></div>
  <div class="dashboard"><span class="lap-label">第 <b id="lap-count">1</b> 圈</span><strong><span id="speed">0</span><small>km/h</small></strong><span class="dashboard-dot"></span></div>
  <div class="drive-controls">
   <div class="steering-controls" aria-label="方向"><button id="steer-left" class="steer-button" aria-label="向左转向">◀</button><button id="steer-right" class="steer-button" aria-label="向右转向">▶</button></div>
   <div class="pedal-controls"><button id="brake" class="pedal brake" aria-label="按住刹车"><span>▰</span><b>刹车</b></button><button id="accelerate" class="pedal accelerator" aria-label="按住油门前进"><span>↑</span><b>油门</b></button></div>
  </div>
 </section>
</div>
<div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
<dialog id="garage-dialog"><div class="dialog-header"><div><small>选一辆，开始拼！</small><h1>我的车库</h1></div><button class="dialog-close" data-close="garage-dialog" aria-label="关闭车型选择">×</button></div><div id="vehicle-grid"></div><p class="catalog-note">原创拼装模型 · 车型外形参考 · 非品牌官方模型</p></dialog>
<dialog id="help-dialog"><div class="dialog-header"><h1>一起动手吧</h1><button class="dialog-close" data-close="help-dialog" aria-label="关闭帮助">×</button></div><div class="help-grid"><div><b>☝</b><strong>拖一拖</strong><span>拖住零件，靠近发光位置</span></div><div><b>↻</b><strong>转一转</strong><span>空白处单指拖动，绕车看一圈</span></div><div><b>↔</b><strong>双指移动</strong><span>双指一起滑动看四周，捏合缩放</span></div><div><b>✓</b><strong>轻点也可以</strong><span>点零件，再点定位「＋」；点已装好的零件直接拆下</span></div></div><p class="desktop-note">电脑：鼠标拖动旋转 · 右键拖动平移 · 滚轮缩放 · 方向键移动视角</p><p class="drive-help">拼好后点「出发」开上公路。按住油门前进，左右键转向，刹车减速；弯道辅助会保护汽车。声音会在第一次触摸后开始，可随时静音。</p></dialog>
<script type="module" src="./app.js?v=3"></script>
</body></html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#163b40"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="description" content="走进小小车库，在自由的 3D 空间里亲手拼装十种汽车。"><title>小小车库 · 3D 汽车工坊</title><link rel="stylesheet" href="./style.css?v=2">
</head>
<body>
<main id="scene" aria-label="三维汽车拼装车库"><div id="loading"><div class="loading-mark">⚙</div><strong>打开车库...</strong></div></main>
<div class="hud">
 <header class="topbar">
  <button id="garage" class="vehicle-button" aria-label="打开车库，选择车型"><span class="garage-icon">▦</span><span><small>小小车库</small><strong id="vehicle-name">奔驰大 G</strong></span><span class="chevron">⌄</span></button>
  <div class="top-actions"><button id="sound" class="icon-button" aria-label="开启声音" title="开启声音"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4zM16 9l5 6m0-6-5 6"/></svg></button><button id="help" class="icon-button" aria-label="怎么玩">?</button></div>
 </header>
 <div id="part-tag" hidden><span id="part-name"></span><button id="fit" aria-label="装好这个零件">装上 ✓</button><button id="detach" aria-label="拆下这个零件">拆下 ↗</button><button id="deselect" aria-label="取消选择">×</button></div>
 <button id="target" hidden aria-label="把选中的零件装到这里"><span>＋</span></button>
 <div id="hint"><span class="hand">☝</span> 拖动零件，拼到车上</div>
 <div class="view-tools"><button id="zoom-in" class="icon-button" aria-label="放大">＋</button><button id="zoom-out" class="icon-button" aria-label="缩小">−</button><button id="home-view" class="icon-button" aria-label="回到完整视角"><svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8M6 9v11h12V9M9 20v-7h6v7"/></svg></button></div>
 <footer class="bottom-bar"><button id="reset" class="tool-button" aria-label="重新拆开这辆车"><svg viewBox="0 0 24 24"><path d="M4 9a8 8 0 1 1 0 6M4 3v6h6"/></svg><span>拆开</span></button><div id="parts" class="parts-strip" aria-label="这辆车的零件"></div><button id="drive" class="drive-button" hidden><span>▶</span> 出发</button></footer>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="garage-dialog"><div class="dialog-header"><div><small>选一辆，开始拼！</small><h1>我的车库</h1></div><button class="dialog-close" data-close="garage-dialog" aria-label="关闭车型选择">×</button></div><div id="vehicle-grid"></div><p class="catalog-note">原创拼装模型 · 车型外形参考 · 非品牌官方模型</p></dialog>
<dialog id="help-dialog"><div class="dialog-header"><h1>一起动手吧</h1><button class="dialog-close" data-close="help-dialog" aria-label="关闭帮助">×</button></div><div class="help-grid"><div><b>☝</b><strong>拖一拖</strong><span>拖住零件，靠近发光位置</span></div><div><b>↻</b><strong>转一转</strong><span>空白处单指拖动，绕车看一圈</span></div><div><b>↔</b><strong>双指移动</strong><span>双指一起滑动看四周，捏合缩放</span></div><div><b>✓</b><strong>轻点也可以</strong><span>点零件，再点「装上」；装好后可拆下</span></div></div><p class="desktop-note">电脑：鼠标拖动旋转 · 右键拖动平移 · 滚轮缩放 · 方向键移动视角</p><button class="primary" data-close="help-dialog">我来试试</button></dialog>
<dialog id="win-dialog"><button class="dialog-close" data-close="win-dialog" aria-label="继续查看">×</button><div class="win-stars">✦ ★ ✦</div><h1>拼好啦！</h1><p id="win-name">准备出发</p><button id="win-drive" class="primary">开出去兜一圈 ▶</button><button id="win-garage" class="secondary">再拼一辆</button></dialog>
<script type="module" src="./app.js?v=2"></script>
</body></html>

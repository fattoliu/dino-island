<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workshop art verification</title><style>body{font:17px system-ui;background:#f4ead2;color:#183e4c;margin:24px}button{font:inherit;border:0;border-radius:12px;background:#154e58;color:#fff;padding:14px 24px;margin:10px}img{max-width:31%;vertical-align:top}pre{white-space:pre-wrap}</style><h1>Original raster art verification</h1><p id="status">RUNNING</p><button id="burst">Play celebration</button><button id="quiet">Reduced-motion celebration</button><button id="clear">Clear</button><button id="still">Freeze ribbon preview</button><div id="images"></div><pre id="results"></pre><script type="module">
import {loadArtAssets,ART_ASSETS,artTexture} from '../materials.js?v=6';
import {WorkshopCelebration} from '../celebration.js?v=6';
import {WorkshopAudio} from '../audio.js?v=6';
const celebration=new WorkshopCelebration(),quiet=new WorkshopCelebration({reducedMotion:true}),sound=new WorkshopAudio();
document.querySelector('#burst').onclick=()=>{quiet.clear();sound.unlock();sound.cheer();celebration.burst();};document.querySelector('#quiet').onclick=()=>{celebration.clear();quiet.burst();};document.querySelector('#clear').onclick=()=>{celebration.clear();quiet.clear();sound.setEnabled(false);};
document.querySelector('#still').onclick=()=>{celebration.burst();cancelAnimationFrame(celebration.frame);celebration.render(celebration.start+1200);cancelAnimationFrame(celebration.frame);};
const loaded=await loadArtAssets(),names=['concrete','asphalt','wood','plaster','paint','metal','rubber','leather','mural'];const report=names.map(name=>({name,loaded:!!artTexture(name).image?.width,width:artTexture(name).image?.width,height:artTexture(name).image?.height}));document.querySelector('#status').textContent=report.every(r=>r.loaded)?'PASS: 9 decoded raster textures':'FAIL';document.querySelector('#results').textContent=JSON.stringify({sources:loaded,textures:report},null,2);for(const [name,url] of Object.entries(ART_ASSETS)){const image=new Image();image.alt=name;image.src=url;document.querySelector('#images').append(image);}
</script></html>

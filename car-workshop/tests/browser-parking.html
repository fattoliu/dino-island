<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manual parking QA</title><style>body{font:17px system-ui;background:#edf4f6;color:#143a48;margin:24px}pre{white-space:pre-wrap}</style><h1>Manual parking QA</h1><p>Uses live vehicle bounds and parking/world state modules. In-memory storage only; never touches the player's collection. This tests parking logic, not touch-device rendering.</p><h2 id="status">RUNNING</h2><pre id="results"></pre><script type="module">
import {VEHICLES,buildVehicle} from '../vehicles.js';
import {createWorldState,stepWorld} from '../world-state.js';
import {createParkingState,stepParking,PARKING_SLOTS} from '../parking-state.js';
import {createFleet,addFinishedCar,markCarParked,saveFleet,readFleet} from '../fleet-state.js';
const report=[],check=(ok,text)=>{report.push({pass:!!ok,text});if(!ok)throw Error(text);};
try{for(const template of VEHICLES){const model=buildVehicle(template.id),slot=PARKING_SLOTS[5],drive={...createWorldState(template.id),x:slot.x,z:slot.z+2,heading:Math.PI/2},p=createParkingState([0,1,2,3,4],model.dimensions);
 // Approach the center under actual throttle, brake, then hold steady.
 for(let i=0;i<120&&drive.z>slot.z+.2;i++){stepWorld(drive,{throttle:1},1/60);stepParking(p,drive,1/60);}
 for(let i=0;i<180;i++){stepWorld(drive,{brake:1},1/60);stepParking(p,drive,1/60);}
 check(p.complete,`${template.name}: physically drove into empty bay and stopped`);
 const fleet=addFinishedCar(createFleet(),template.id,'default',VEHICLES,1),parked=markCarParked(fleet,fleet.cars[0].id,p.slotId,2);let serialized;const memory={setItem(k,v){serialized=v;},getItem(){return serialized;}};saveFleet(memory,parked);check(readFleet(memory,VEHICLES).fleet.cars[0].parkingSlotId===5,`${template.name}: parking survives reload`);
 model.group.traverse(o=>o.geometry?.dispose());}
 document.querySelector('#status').textContent=`PASS: ${report.length} checks`;
}catch(error){document.querySelector('#status').textContent='FAIL: '+error.message;}document.querySelector('#results').textContent=JSON.stringify(report,null,2);
</script></html>
